<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionAssist AI - EER Diagram Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e293b;
    }
    h1 {
      font-size: 24px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 12px;
      background: #0284c7;
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button, a.btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover, a.btn:hover {
      background: #38bdf8;
      color: #0f172a;
    }
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 1200px;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-weight: 500;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .card {
      width: 100%;
      max-width: 1200px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    object {
      width: 100%;
      min-height: 850px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>VisionAssist AI <span class="badge">EER Diagram</span></h1>
      <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Enhanced Entity-Relationship Diagram for Voice-Guided Testing & Proctoring System</p>
    </div>
    <div class="controls">
      <a class="btn" href="EER_Diagram_VisionAssist_AI.jpg" download>📥 Download Photo (JPG)</a>
      <a class="btn" href="EER_Diagram_VisionAssist_AI.svg" download>📥 Download Vector (SVG)</a>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('photo')">🖼️ High-Res Photo (JPG)</button>
    <button class="tab-btn" onclick="switchTab('vector')">📐 Scalable Vector (SVG)</button>
  </div>

  <div class="card" id="photoView">
    <img src="EER_Diagram_VisionAssist_AI.jpg" alt="VisionAssist AI Enhanced Entity-Relationship (EER) Diagram" />
  </div>

  <div class="card" id="vectorView" style="display: none;">
    <object data="EER_Diagram_VisionAssist_AI.svg" type="image/svg+xml"></object>
  </div>

  <script>
    function switchTab(mode) {
      const photoView = document.getElementById('photoView');
      const vectorView = document.getElementById('vectorView');
      const btns = document.querySelectorAll('.tab-btn');
      if (mode === 'photo') {
        photoView.style.display = 'flex';
        vectorView.style.display = 'none';
        btns[0].classList.add('active');
        btns[1].classList.remove('active');
      } else {
        photoView.style.display = 'none';
        vectorView.style.display = 'flex';
        btns[0].classList.remove('active');
        btns[1].classList.add('active');
      }
    }
  </script>
</body>
</html>
